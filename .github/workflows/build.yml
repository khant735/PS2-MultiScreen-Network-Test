name: PS2 development build
on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compile with PS2DEV
        run: |
          docker run --rm -v "$PWD:/src" -w /src ps2dev/ps2dev:latest sh -ec '
            if ! command -v make >/dev/null 2>&1; then
              if command -v apk >/dev/null 2>&1; then apk add --no-cache make
              elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y make
              else echo "No supported package manager to install GNU make" >&2; exit 1; fi
            fi
            make
          '
      - name: Package ELF and source separately
        run: python3 scripts/package.py --version 0.1.0
      - name: Upload temporary build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS2-MultiScreen-build-${{ github.run_number }}
          path: dist/*
          retention-days: 90
      - name: Publish separately downloadable development release assets
        if: github.event_name != 'pull_request' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dev-${{ github.ref_name }}-${{ github.run_number }}"
          # Stage under glob-safe paths; retain original names as release asset labels.
          mkdir -p release-upload
          assets=(dist/*.ELF dist/*-SOURCE.zip dist/manifest.json dist/SHA256SUMS.txt)
          upload_args=()
          index=0
          for asset in "${assets[@]}"; do
            test -f "$asset" || exit 1
            index=$((index + 1))
            extension="${asset##*.}"
            safe_path="release-upload/asset-$index.$extension"
            cp -- "$asset" "$safe_path"
            upload_args+=("$safe_path#${asset##*/}")
          done
          gh release create "$TAG" "${upload_args[@]}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "PS2 Multi-Screen development build ${{ github.run_number }} (${{ github.ref_name }})" \
            --notes "Experimental bootstrap build from commit $GITHUB_SHA. Not a validated GT3/GT4 network test."
