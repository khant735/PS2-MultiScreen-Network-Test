name: PS2 development build
on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compile with PS2DEV
        run: |
          docker run --rm -v "$PWD:/src" -w /src ps2dev/ps2dev:latest sh -ec '
            if ! command -v make >/dev/null 2>&1; then
              if command -v apk >/dev/null 2>&1; then apk add --no-cache make
              elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y make
              else echo "No supported package manager to install GNU make" >&2; exit 1; fi
            fi
            make
          '
      - name: Package ELF and source separately
        run: python3 scripts/package.py --version 0.1.0
      - name: Upload temporary build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS2-MultiScreen-build-${{ github.run_number }}
          path: dist/*
          retention-days: 90
      - name: Publish separately downloadable development release assets
        if: github.event_name != 'pull_request' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dev-${{ github.ref_name }}-${{ github.run_number }}"
          # gh CLI treats square brackets as glob syntax even for quoted filenames.
          # Create the release first, then upload original files via the REST API
          # so the release asset *name* is the original timestamped filename.
          assets=(dist/*.ELF dist/*-SOURCE.zip dist/manifest.json dist/SHA256SUMS.txt)
          for asset in "${assets[@]}"; do
            test -f "$asset" || { echo "Missing $asset" >&2; exit 1; }
          done
          gh release create "$TAG" \
            --target "$GITHUB_SHA" --prerelease \
            --title "PS2 Multi-Screen development build ${{ github.run_number }} (${{ github.ref_name }})" \
            --notes "Experimental bootstrap build from commit $GITHUB_SHA. Not a validated GT3/GT4 network test."
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" --jq .id)
          for asset in "${assets[@]}"; do
            name="${asset##*/}"
            encoded_name=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1],safe=""))' "$name")
            echo "Uploading release asset: $name"
            # Use curl directly against the documented GitHub asset upload endpoint.
            # GitHub CLI's --hostname rewrites uploads.github.com to api.uploads.github.com.
            for attempt in 1 2 3; do
              if curl --fail-with-body --show-error --silent --retry 2 --retry-all-errors --retry-delay 2 \
                  --request POST \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  -H "Content-Type: application/octet-stream" \
                  --data-binary @"$asset" \
                  "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$encoded_name" \
                  -o /tmp/release-upload-response.json; then
                python3 -c 'import json; d=json.load(open("/tmp/release-upload-response.json")); assert d["state"] == "uploaded", d; print("Published:",d["name"],d["size"],"bytes")'
                break
              fi
              if [ "$attempt" -eq 3 ]; then echo "Release upload failed for $name" >&2; exit 1; fi
              sleep 3
            done
          done
